name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-terminal mkdocs-minify-plugin

      - name: Build MkDocs
        run: mkdocs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: ChainLink Build
        uses: Sawblade-Entertainment/ChainLinkAction@main
        with:
          action: 'build'
          output_file: 'RazorInput.rbxmx'

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: razorinput-build
          path: RazorInput.rbxmx
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: razorinput-build
          path: ./release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ChainLink Install
        uses: Sawblade-Entertainment/ChainLinkAction@main
        with:
          action: 'install'

      - name: Check with Selene
        run: selene .
      
      - name: Check formatting with Stylua
        run: stylua --check .

      - name: ChainLink Publish
        uses: Sawblade-Entertainment/ChainLinkAction@main
        with:
          action: 'publish'
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
  
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: razorinput-build
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/RazorInput.rbxm
