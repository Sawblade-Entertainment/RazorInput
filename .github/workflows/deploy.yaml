name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-terminal mkdocs-minify-plugin

      - name: Build MkDocs
        run: mkdocs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Install ChainLink
        shell: bash
        run: |
          URL="https://github.com/Sawblade-Entertainment/ChainLink/releases/download/v0.1.3/chainlink-linux-amd64"
          curl -L "$URL" -o chainlink
          chmod +x chainlink
          sudo mv chainlink /usr/local/bin/

      - name: ChainLink Build
        shell: bash
        run: chainlink build RazorInput.rbxmx

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: razorinput-build
          path: RazorInput.rbxmx
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: razorinput-build
          path: ./release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install ChainLink
        shell: bash
        run: |
          URL="https://github.com/Sawblade-Entertainment/ChainLink/releases/download/v0.1.3/chainlink-linux-amd64"
          curl -L "$URL" -o chainlink
          chmod +x chainlink
          sudo mv chainlink /usr/local/bin/

      - name: Linting & Styling
        shell: bash
        run: |
          chainlink install
          $HOME/.chainlink/selene .
          $HOME/.chainlink/stylua --check .

      - name: ChainLink Publish
        shell: bash
        run: chainlink publish --token ${{ secrets.WALLY_TOKEN }}
  
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: razorinput-build
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/RazorInput.rbxm
